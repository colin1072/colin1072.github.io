<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="Colin的个人空间 — 博客 · 摄影 · 代码" />
<meta name="theme-color" content="#0b0d10" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Colin · 个人空间</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- 开场加载 -->
  <div class="preloader" id="preloader">
    <div class="pre-name">Colin</div>
    <div class="pre-line"></div>
    <div class="pre-tip">正在进入</div>
  </div>

  <!-- 全屏转场 -->
  <div class="page-transition" id="pageTransition">
    <div class="pt-curtain"></div>
    <div class="pt-label" id="ptLabel"></div>
    <div class="pt-sub">正在前往</div>
  </div>

  <!-- 背景 -->
  <div class="bg-wrap" id="parallaxBg">
    <div class="bg" id="bgA"></div>
    <div class="bg" id="bgB"></div>
  </div>
  <div class="mask"></div>
  <div class="grain"></div>

  <!-- 弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-content" id="modalContent"></div>
      <div class="modal-hint">点击任意位置关闭</div>
    </div>
  </div>

  <!-- 自定义光标 -->
  <div class="cursor-ring" id="cursorRing"></div>
  <div class="cursor-dot" id="cursorDot"></div>

  <div class="page">
    <header class="fade d1">
      <div class="logo">Colin</div>
      <div class="clock" id="clock">--:--:--</div>
    </header>

    <main>
      <div id="mainInner">
        <p class="greeting fade d2" id="greeting">WELCOME</p>
        <h1 class="fade d3">Colin</h1>
        <p class="role fade d4">开发者 ／ 摄影爱好者 ／ 记录者</p>
        <div class="divider fade d4"></div>
        <p class="quote fade d5" id="quote">代码之外，生活亦有诗意。</p>

        <nav class="fade d6" id="navLinks"></nav>
      </div>
    </main>

    <footer class="fade d7">
      <span id="copyright">© 2026 Colin</span>
      <span id="motto">步履不停 · 初心不忘</span>
    </footer>
  </div>

<script src="config.js"></script>
<script>
/* 动态渲染：根据 CONFIG 生成导航与文案 */
(function applyConfig() {
  /* ---- meta ---- */
  document.title = CONFIG.site.title;
  document.querySelector('meta[name="description"]').content = CONFIG.site.description;

  /* ---- preloader ---- */
  document.querySelector('.pre-name').textContent = CONFIG.site.name;
  document.querySelector('.pre-tip').textContent  = CONFIG.site.preloaderTip;

  /* ---- 转场提示 ---- */
  document.querySelector('.pt-sub').textContent = CONFIG.site.transitionTip;

  /* ---- header ---- */
  document.querySelector('.logo').textContent = CONFIG.site.name;

  /* ---- hero ---- */
  document.querySelector('h1').textContent     = CONFIG.site.name;
  document.querySelector('.role').textContent   = CONFIG.site.role;

  /* ---- 导航 ---- */
  const nav = document.getElementById('navLinks');
  CONFIG.nav.forEach((item, i) => {
    const a = document.createElement('a');
    a.className = 'link';
    a.dataset.type = item.type || 'link';
    if (item.type === 'modal') {
      a.href = 'javascript:void(0)';
      a.dataset.zh = item.zh;
      a.dataset.content = item.content || '';
      a.dataset.qrcode  = item.qrcode || '';
    } else {
      a.href = item.href;
      a.target = '_blank';
      a.rel = 'noopener';
    }
    a.innerHTML =
      `<span class="num">${String(i + 1).padStart(2, '0')}</span>` +
      `<span class="zh">${item.zh}</span>` +
      `<span class="en">${item.en}</span>`;
    nav.appendChild(a);
  });

  /* ---- 页脚 ---- */
  document.getElementById('copyright').textContent = CONFIG.site.copyright;
  document.getElementById('motto').textContent     = CONFIG.site.motto;
})();
</script>
<script src="main.js"></script>
</body>
</html>
